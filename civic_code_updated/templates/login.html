<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Civic Code</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff006e; --bg: #0a0a0a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: #f0f0f0; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 0%, #ff006e18, transparent 70%); pointer-events: none; }
.card { background: #141414; border: 1px solid #2a2a2a; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; }
.brand { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-align: center; margin-bottom: 8px; }
h2 { text-align: center; font-size: 1.1rem; color: #888; margin-bottom: 28px; font-weight: 400; }
.form-group { margin-bottom: 14px; }
label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; font-weight: 500; }
input { width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a; color: #f0f0f0; padding: 12px 16px; border-radius: 12px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border 0.2s; }
input:focus { border-color: var(--primary); }
input::placeholder { color: #555; }
.hint { color: #555; font-size: 0.8rem; margin-top: 4px; }
.btn { width: 100%; padding: 14px; border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; background: var(--primary); color: #fff; margin-top: 8px; transition: all 0.2s; box-shadow: 0 4px 20px #ff006e33; }
.btn:hover { transform: translateY(-1px); }
.flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 0.9rem; background: #2a0d0d; border: 1px solid #ff4444; color: #ff4444; }
.links { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
.links a { color: var(--primary); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">⚡ Civic Code</div>
  <h2>Welcome back 👋</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Username, Email or Phone</label>
      <input name="identifier" placeholder="Enter any of these" required autocomplete="username">
      <p class="hint">Use any of your registered identifiers</p>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Your password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Sign In →</button>
  </form>
  <p class="links">New here? <a href="/register">Create account</a></p>
</div>
</body>
</html>
